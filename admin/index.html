<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Archipelago</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Spectral:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="top">
    <div class="brand">⚓ Archipelago</div>
    <nav id="site-nav"></nav>
  </header>

  <!-- admin.js shows the password gate here, and only renders the admin UI
       (from the template below) once the password is right. -->
  <main id="admin-root">
    <div class="card admin-gate"><p class="muted">Loading…</p></div>
  </main>

  <!-- The admin UI. Rendered by admin-app.js only after the password gate:
       a toolbar, the campaign list (left) and the detail pane (right). On a
       phone the list drills into the detail, with a "‹ Campaigns" link back. -->
  <template id="admin-app-template">
    <div class="gm-toolbar admin-toolbar">
      <div class="gm-toolbar-row">
        <h2 class="admin-toolbar-title">Admin</h2>
        <div class="admin-toolbar-actions">
          <button type="button" class="small" id="admin-lock-btn" title="Lock the admin page again in this tab">🔒 Lock</button>
        </div>
      </div>
    </div>

    <div class="admin-main" id="admin-main" data-view="list">
      <nav class="card admin-list" aria-label="Campaigns">
        <input type="search" id="admin-filter" class="admin-filter" placeholder="Filter campaigns…" aria-label="Filter campaigns" autocomplete="off">
        <div id="admin-list"></div>
      </nav>
      <section class="admin-detail" id="admin-detail"></section>
    </div>

    <input type="file" id="admin-import-file" accept="application/json,.json" hidden>
    <div class="gm-toast" id="admin-toast" role="status" aria-live="polite"></div>
  </template>

  <footer class="foot">Fair winds. ⚓</footer>

  <script type="module" src="../js/nav.js"></script>
  <script type="module" src="admin.js"></script>
</body>
</html>
