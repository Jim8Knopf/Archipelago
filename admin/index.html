<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Archipelago</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Spectral:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="top">
    <div class="brand">⚓ Archipelago</div>
    <nav id="site-nav"></nav>
  </header>

  <!-- admin.js shows the password gate here, and only renders the admin UI
       (from the template below) once the password is right. -->
  <main id="admin-root">
    <div class="card admin-gate"><p class="muted">Loading…</p></div>
  </main>

  <template id="admin-app-template">
    <div class="card full-width">
      <div class="row spread">
        <h2>Admin</h2>
        <button type="button" class="small" id="admin-lock-btn">🔒 Lock</button>
      </div>
      <p class="muted">Every campaign and character in this Firebase project, across the whole database — not just one Campaign ID. Useful for cleanup, or finding a campaign ID you forgot.</p>
      <p class="muted">⚠️ The password only hides this page. The Firestore rules are still open, so anyone with a campaign ID (or the know-how to query the database directly) can read and change everything listed here.</p>
      <div class="status-msg" id="admin-status"></div>
    </div>

    <!-- One card per campaign, packed into the same multi-column flow as
         the player sheet (display: contents lets the cards join main's columns). -->
    <div id="admin-content">
      <div class="card"><p class="muted">Loading…</p></div>
    </div>
  </template>

  <footer class="foot">Fair winds. ⚓</footer>

  <script type="module" src="../js/nav.js"></script>
  <script type="module" src="admin.js"></script>
</body>
</html>
