name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit SHA to deploy (empty = branch selected above)"
        required: false
        default: ""
        type: string
      pr:
        description: "PR number to report the result to (set automatically by the deploy label)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  # Adding the "deploy" label to a PR starts a manual deploy run on main for the
  # PR's branch. PR runs use refs/pull/N/merge, which the github-pages
  # environment protection rules reject, so the PR run can't deploy directly.
  trigger-from-pr:
    if: github.event_name == 'pull_request' && github.event.label.name == 'deploy'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR_BRANCH: ${{ github.event.pull_request.head.ref }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Start deploy of PR branch
        # The dispatched run uses main's copy of this workflow. If main doesn't
        # accept the `pr` input yet (this change not merged), deploy without
        # it — the deploy still runs, it just can't report back to the PR.
        run: |
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main -f ref="$PR_BRANCH" -f pr="$PR_NUMBER" \
            || gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main -f ref="$PR_BRANCH"

      - name: Comment that the deploy started
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            "🚀 Deploy of \`$PR_BRANCH\` started. It runs as a separate **Deploy to GitHub Pages** run on \`main\` ([Actions]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/deploy.yml)); the result will be posted here."

      # Remove the label so adding it again triggers a fresh deploy. Only on
      # success: if starting the deploy failed, the label stays as a signal.
      - name: Remove deploy label
        run: gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label deploy

      - name: Comment that the deploy could not start
        if: failure()
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            "❌ Couldn't start the deploy of \`$PR_BRANCH\`. See [the run log]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."

  # Build and deploy are separate jobs, as in GitHub's own Pages templates.
  # With upload and deploy-pages in the same job, deploy-pages sometimes
  # looked up the artifact before it was registered and failed with
  # 'No artifacts named "github-pages" were found'.
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Generate firebase-config.js from secrets
        run: |
          cat > js/firebase-config.js << EOF
          export const firebaseConfig = {
            apiKey: "${{ secrets.FIREBASE_API_KEY }}",
            authDomain: "${{ secrets.FIREBASE_AUTH_DOMAIN }}",
            projectId: "${{ secrets.FIREBASE_PROJECT_ID }}",
            storageBucket: "${{ secrets.FIREBASE_STORAGE_BUCKET }}",
            messagingSenderId: "${{ secrets.FIREBASE_SENDER_ID }}",
            appId: "${{ secrets.FIREBASE_APP_ID }}"
          };
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Label-triggered deploys report back to the PR, so the result is
  # visible there instead of only in a run on main.
  report:
    needs: [build, deploy]
    if: always() && github.event_name == 'workflow_dispatch' && inputs.pr != ''
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ inputs.pr }}
      REF: ${{ inputs.ref }}
      BUILD: ${{ needs.build.result }}
      DEPLOY: ${{ needs.deploy.result }}
      PAGE_URL: ${{ needs.deploy.outputs.page_url }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Report result to PR
        run: |
          if [ "$BUILD" = success ] && [ "$DEPLOY" = success ]; then
            body="✅ Deployed \`$REF\` to $PAGE_URL — hard-refresh (Ctrl+Shift+R) if you still see the old version. ([run]($RUN_URL))"
          elif [ "$BUILD" = cancelled ] || [ "$DEPLOY" = cancelled ]; then
            body="⏹️ Deploy of \`$REF\` was cancelled, probably replaced by a newer deploy. ([run]($RUN_URL))"
          else
            body="❌ Deploy of \`$REF\` failed (build: $BUILD, deploy: $DEPLOY). ([run]($RUN_URL))"
          fi
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body"
