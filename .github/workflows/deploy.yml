name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit SHA to deploy (empty = branch selected above)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  # Adding the "deploy" label to a PR starts a manual deploy run on main for the
  # PR's branch. PR runs use refs/pull/N/merge, which the github-pages
  # environment protection rules reject, so the PR run can't deploy directly.
  trigger-from-pr:
    if: github.event_name == 'pull_request' && github.event.label.name == 'deploy'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR_BRANCH: ${{ github.event.pull_request.head.ref }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Start deploy of PR branch
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main -f ref="$PR_BRANCH"

      # Remove the label so adding it again triggers a fresh deploy
      - name: Remove deploy label
        if: always()
        run: gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label deploy

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Generate firebase-config.js from secrets
        run: |
          cat > js/firebase-config.js << EOF
          export const firebaseConfig = {
            apiKey: "${{ secrets.FIREBASE_API_KEY }}",
            authDomain: "${{ secrets.FIREBASE_AUTH_DOMAIN }}",
            projectId: "${{ secrets.FIREBASE_PROJECT_ID }}",
            storageBucket: "${{ secrets.FIREBASE_STORAGE_BUCKET }}",
            messagingSenderId: "${{ secrets.FIREBASE_SENDER_ID }}",
            appId: "${{ secrets.FIREBASE_APP_ID }}"
          };
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
